<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#7A51EC"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 顶部彩色条 -->
  <rect x="0" y="0" width="150" height="8" fill="#F9B801"/>
  <rect x="150" y="0" width="150" height="8" fill="#F302C9"/>
  <rect x="300" y="0" width="150" height="8" fill="#7DC353"/>
  <rect x="450" y="0" width="150" height="8" fill="#7A51EC"/>
  <rect x="600" y="0" width="150" height="8" fill="#F9B801"/>
  <rect x="750" y="0" width="150" height="8" fill="#F302C9"/>
  <rect x="900" y="0" width="150" height="8" fill="#7DC353"/>
  <rect x="1050" y="0" width="150" height="8" fill="#7A51EC"/>

  <!-- 精灵星星 -->
  <g transform="translate(900, 200)">
    <polygon points="0,-70 18,-22 70,-22 28,8 42,58 0,30 -42,58 -28,8 -70,-22 -18,-22" fill="#F9B801" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="-15" cy="-8" r="7" fill="#1A1A1A"/>
    <circle cx="15" cy="-8" r="7" fill="#1A1A1A"/>
    <circle cx="-13" cy="-10" r="3" fill="white"/>
    <circle cx="17" cy="-10" r="3" fill="white"/>
    <path d="M-12 8 Q0 18 12 8" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 画笔 -->
    <rect x="45" y="-50" width="6" height="28" rx="3" fill="#7A51EC" transform="rotate(20 48 -36)"/>
    <polygon points="48,-56 52,-64 54,-54" fill="#F9B801" transform="rotate(20 51 -58)"/>
  </g>

  <!-- 小装饰角色 -->
  <circle cx="1020" cy="350" r="30" fill="#F302C9"/>
  <circle cx="1012" cy="345" r="4" fill="#1A1A1A"/>
  <circle cx="1028" cy="345" r="4" fill="#1A1A1A"/>
  <path d="M1014 356 Q1020 362 1026 356" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <rect x="950" y="380" width="45" height="55" rx="22" fill="#7DC353" transform="rotate(-5 972 407)"/>
  <circle cx="965" cy="400" r="4" fill="#1A1A1A"/>
  <circle cx="980" cy="400" r="4" fill="#1A1A1A"/>
  <path d="M965 412 Q972 417 980 412" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 标题 -->
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#1A1A1A" letter-spacing="-3">
    星绘<tspan fill="#7A51EC">智愈</tspan>
  </text>

  <!-- 副标题 -->
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="20" fill="#666666" font-weight="600">
    AI 辅助油画教育与艺术疗愈系统
  </text>

  <!-- 描述 -->
  <text x="80" y="280" font-family="system-ui, sans-serif" font-size="16" fill="#888888" font-weight="600">
    临摹莫奈、梵高、高更等大师经典画作
  </text>
  <text x="80" y="305" font-family="system-ui, sans-serif" font-size="16" fill="#888888" font-weight="600">
    AI 陪你一笔一笔完成创作，在艺术中感受疗愈
  </text>

  <!-- 五步流程 -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#F9B801" stroke="#1A1A1A" stroke-width="2"/>
    <text x="40" y="45" font-size="28" text-anchor="middle" fill="#1A1A1A">😊</text>
    <text x="40" y="70" font-size="9" text-anchor="middle" fill="#1A1A1A" font-weight="800">选心情</text>

    <text x="100" y="44" font-size="18" fill="#DDD" font-weight="900">→</text>

    <rect x="120" y="0" width="80" height="80" rx="20" fill="#F302C9" stroke="#1A1A1A" stroke-width="2"/>
    <text x="160" y="45" font-size="28" text-anchor="middle" fill="#1A1A1A">🎨</text>
    <text x="160" y="70" font-size="9" text-anchor="middle" fill="#1A1A1A" font-weight="800">选大师</text>

    <text x="220" y="44" font-size="18" fill="#DDD" font-weight="900">→</text>

    <rect x="240" y="0" width="80" height="80" rx="20" fill="#7DC353" stroke="#1A1A1A" stroke-width="2"/>
    <text x="280" y="45" font-size="28" text-anchor="middle" fill="#1A1A1A">✏️</text>
    <text x="280" y="70" font-size="9" text-anchor="middle" fill="#1A1A1A" font-weight="800">陪画</text>

    <text x="340" y="44" font-size="18" fill="#DDD" font-weight="900">→</text>

    <rect x="360" y="0" width="80" height="80" rx="20" fill="#7BA7CC" stroke="#1A1A1A" stroke-width="2"/>
    <text x="400" y="45" font-size="28" text-anchor="middle" fill="#1A1A1A">😌</text>
    <text x="400" y="70" font-size="9" text-anchor="middle" fill="#1A1A1A" font-weight="800">再选心情</text>

    <text x="460" y="44" font-size="18" fill="#DDD" font-weight="900">→</text>

    <rect x="480" y="0" width="80" height="80" rx="20" fill="#7A51EC" stroke="#1A1A1A" stroke-width="2"/>
    <text x="520" y="45" font-size="28" text-anchor="middle" fill="white">📋</text>
    <text x="520" y="70" font-size="9" text-anchor="middle" fill="white" font-weight="800">疗愈报告</text>
  </g>

  <!-- 底部标签 -->
  <rect x="80" y="490" width="90" height="28" rx="14" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="125" y="509" font-family="system-ui, sans-serif" font-size="11" fill="#888" font-weight="700" text-anchor="middle">大师图片库</text>

  <rect x="185" y="490" width="90" height="28" rx="14" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="230" y="509" font-family="system-ui, sans-serif" font-size="11" fill="#888" font-weight="700" text-anchor="middle">情绪前后测</text>

  <rect x="290" y="490" width="90" height="28" rx="14" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="335" y="509" font-family="system-ui, sans-serif" font-size="11" fill="#888" font-weight="700" text-anchor="middle">陪画模式</text>

  <rect x="395" y="490" width="90" height="28" rx="14" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="440" y="509" font-family="system-ui, sans-serif" font-size="11" fill="#888" font-weight="700" text-anchor="middle">共同注意</text>

  <rect x="500" y="490" width="90" height="28" rx="14" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="545" y="509" font-family="system-ui, sans-serif" font-size="11" fill="#888" font-weight="700" text-anchor="middle">疗愈报告</text>

  <rect x="605" y="490" width="90" height="28" rx="14" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="650" y="509" font-family="system-ui, sans-serif" font-size="11" fill="#888" font-weight="700" text-anchor="middle">安静模式</text>

  <!-- 底部信息 -->
  <text x="80" y="570" font-family="system-ui, sans-serif" font-size="13" fill="#AAAAAA" font-weight="600">
    上海交通大学 · 星月绘愈社 · 2026 Light 创造营
  </text>

  <!-- 边框 -->
  <rect x="0" y="622" width="1200" height="8" fill="#1A1A1A"/>
</svg>

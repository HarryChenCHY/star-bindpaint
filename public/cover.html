<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>星迹智绘 StarTrace</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#17233f;font-family:system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1100px;margin:auto;padding:64px 24px 80px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:42px;align-items:center;background:#fff;border:3px solid #17233f;border-radius:36px;padding:54px;box-shadow:10px 10px 0 #6558d9}.tag{font-size:12px;font-weight:900;letter-spacing:.16em;color:#6558d9}.hero h1{font-size:clamp(48px,8vw,88px);line-height:.95;margin:18px 0 12px;letter-spacing:-.06em}.hero h2{margin:0;font-size:26px}.hero p{font-weight:750;line-height:1.9;color:#536079}.moon{aspect-ratio:1;border:3px solid #17233f;border-radius:34px;background:#eceafe;display:grid;place-items:center;box-shadow:8px 8px 0 #ffd166;font-size:132px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.card{background:#fff;border:3px solid #17233f;border-radius:26px;padding:26px;box-shadow:5px 5px 0 #17233f}.card b{font-size:20px}.card p{font-size:14px;font-weight:700;line-height:1.7;color:#65708a}.flow{margin-top:28px;border:3px solid #17233f;border-radius:30px;padding:30px;background:#fff7d9}.flow h3{margin:0 0 18px;font-size:26px}.steps{display:flex;gap:10px;flex-wrap:wrap}.step{border:2px solid #17233f;border-radius:999px;background:#fff;padding:10px 16px;font-weight:900}footer{text-align:center;margin-top:32px;font-weight:800;color:#65708a}@media(max-width:760px){.shell{padding-top:24px}.hero{grid-template-columns:1fr;padding:30px}.moon{font-size:90px}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div><div class="tag">AI DRAWING COMPANION</div><h1>星迹智绘</h1><h2>StarTrace · 月亮伙伴</h2><p>把一幅参考图拆成可跟随的绘画星点与星迹笔触，让零基础绘画者从第一笔开始，逐步完成一幅作品。</p></div>
      <div class="moon" aria-label="月亮伙伴">🌙</div>
    </section>
    <section class="cards">
      <article class="card"><b>绘画星点</b><p>提示下一笔的起点、方向与颜色，把复杂作品变成可执行的小步骤。</p></article>
      <article class="card"><b>星迹笔触</b><p>由笔触拆解算法生成有序路径，支持完整、平衡与轻量三档引导。</p></article>
      <article class="card"><b>作品星图</b><p>保存每次练习和客观学习反馈，观察真实动笔与持续练习变化。</p></article>
    </section>
    <section class="flow"><h3>五步 AI 辅助绘画</h3><div class="steps"><span class="step">1 选择参考</span><span class="step">2 AI 拆解</span><span class="step">3 跟随星迹</span><span class="step">4 完成绘画</span><span class="step">5 查看反馈</span></div></section>
    <footer>沿着星迹，一笔一笔画出自己的世界。</footer>
  </main>
</body>
</html>
